name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      # The memo and the chart are generated, so a broken generator fails the build.
      - run: python run.py --summary
      - run: python run.py --fast
      - run: python docs/make_chart.py
